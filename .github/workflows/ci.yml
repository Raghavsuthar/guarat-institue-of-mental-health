name: CI & Quality Assurance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Validate, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Audit dependency vulnerabilities (report-only)
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{name:x.name,title:x.title,url:x.url,range:x.range})}))},null,2))"

      - name: Validate Trilingual Content Integrity
        run: npm run validate

      - name: Check TypeScript Types & Linting
        run: npm run lint

      - name: Run API Safety Tests
        run: npm test

      - name: Build Production Bundle & Server
        run: npm run build

      - name: Smoke test self-hosted Express server
        run: |
          PORT=4173 NODE_ENV=production node dist/server.cjs > /tmp/gimh-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/api/health > /tmp/gimh-health.json; then
              break
            fi
            sleep 1
          done
          node -e "const fs=require('node:fs');const health=JSON.parse(fs.readFileSync('/tmp/gimh-health.json','utf8'));if(health.status!=='ok')process.exit(1)"
